<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen3 语音工作站 · ASR / TTS / 克隆</title>
<style>
  :root { --bg:#1e1e2e; --card:#27273a; --fg:#cdd6f4; --sub:#a6adc8; --accent:#89b4fa; --ok:#a6e3a1; --err:#f38ba8; --warn:#fab387; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
  .wrap { max-width:880px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--sub); font-size:13px; margin-bottom:16px; }
  .status { font-size:12px; font-family:monospace; background:#181825; border-radius:10px; padding:10px 14px; margin-bottom:16px; line-height:1.9; }
  .status b { color:var(--accent); }
  .card { background:var(--card); border-radius:14px; padding:16px 18px; margin-bottom:16px; }
  .card h2 { font-size:16px; margin:0 0 10px; }
  .hint { color:var(--sub); font-size:12px; margin:6px 0 10px; line-height:1.7; }
  label { display:block; font-size:13px; color:var(--sub); margin:10px 0 4px; }
  textarea, input[type=text] { width:100%; background:#181825; color:var(--fg); border:1px solid #313244; border-radius:8px; padding:8px 10px; font-size:14px; }
  textarea { resize:vertical; }
  select { width:100%; background:#181825; color:var(--fg); border:1px solid #313244; border-radius:8px; padding:8px 10px; font-size:14px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > * { flex:1; min-width:140px; }
  button { background:var(--accent); color:#11111b; border:none; border-radius:8px; padding:9px 16px; font-size:14px; cursor:pointer; font-weight:600; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.secondary { background:#45475a; color:var(--fg); font-weight:400; }
  button.danger { background:var(--err); }
  button.rec { background:var(--err); color:#fff; animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.6; } }
  audio { width:100%; margin-top:10px; }
  .msg { font-size:13px; margin-top:8px; min-height:18px; white-space:pre-wrap; }
  .msg.ok { color:var(--ok); } .msg.err { color:var(--err); } .msg.warn { color:var(--warn); }
  .voice-item { display:flex; align-items:center; gap:8px; font-size:13px; padding:6px 8px; border-radius:8px; }
  .voice-item:hover { background:#313244; }
  .voice-item .name { flex:1; }
  .voice-item .tag { font-size:11px; color:var(--warn); }
  .voice-item button { padding:3px 10px; font-size:12px; font-weight:400; }
  hr { border:none; border-top:1px solid #313244; margin:14px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎙️ Qwen3 语音工作站</h1>
  <div class="sub">Qwen3-ASR（识别）+ Qwen3-TTS（合成 / 音色克隆）独立服务</div>
  <div class="status" id="status">加载中...</div>

  <!-- ===== 语音合成 ===== -->
  <div class="card">
    <h2>🔊 语音合成</h2>
    <div class="hint">内置音色走 CustomVoice 模型；克隆音色走 Base 模型（首次使用需加载数分钟）</div>
    <label>音色</label>
    <select id="voice"></select>
    <label>合成文本</label>
    <textarea id="synth-text" rows="4" placeholder="输入要合成的文本，长文本自动按句切分"></textarea>
    <div class="row">
      <div><label>语言</label>
        <select id="synth-lang">
          <option value="Auto">自动</option><option value="Chinese">中文</option>
          <option value="English">英文</option><option value="Japanese">日语</option>
          <option value="Korean">韩语</option>
        </select>
      </div>
      <div><label>语气指令（可选，仅内置音色）</label>
        <input type="text" id="synth-instruct" placeholder="例如：用开心的语气说">
      </div>
    </div>
    <div style="margin-top:10px"><button id="synth-btn">🔊 合成</button></div>
    <audio id="synth-audio" controls></audio>
    <div class="msg" id="synth-msg"></div>
  </div>

  <!-- ===== 音色克隆 ===== -->
  <div class="card">
    <h2>🎙️ 音色克隆</h2>
    <div class="hint">录制或上传一段 <b>≥5 秒</b>的干净人声作为参考。填写参考原文（效果最好）；
      留空将尝试自动识别。勾选「同时保存为音色」后可直接在上方合成中选用。</div>
    <div class="row">
      <button id="rec-btn" class="secondary">🎤 录制参考音频</button>
      <input type="file" id="clone-file" accept="audio/*" style="flex:1;color:var(--sub);font-size:13px">
    </div>
    <div class="msg" id="rec-msg"></div>
    <label>克隆文本（要让它说的话）</label>
    <textarea id="clone-text" rows="3"></textarea>
    <div class="row">
      <div><label>参考音频原文（可选，效果最好）</label>
        <input type="text" id="clone-ref-text" placeholder="留空则自动识别"></div>
      <div><label>语言</label>
        <select id="clone-lang">
          <option value="Auto">自动</option><option value="Chinese">中文</option>
          <option value="English">英文</option>
        </select></div>
    </div>
    <label>音色名称（勾选保存时必填）</label>
    <input type="text" id="clone-name" placeholder="例如：我的声音">
    <div style="margin-top:10px">
      <button id="clone-btn">🎙️ 克隆合成</button>
      <button id="save-voice-btn" class="secondary">💾 仅保存为音色</button>
      <label style="display:inline-flex;align-items:center;gap:6px;margin:0 0 0 12px;font-size:13px">
        <input type="checkbox" id="clone-xvec"> 仅声纹模式（忽略原文）
      </label>
    </div>
    <audio id="clone-audio" controls></audio>
    <div class="msg" id="clone-msg"></div>
  </div>

  <!-- ===== 语音识别 ===== -->
  <div class="card">
    <h2>🗣️ 语音识别 (ASR)</h2>
    <div class="hint">录音或上传音频 → Qwen3-ASR 转写（52 种语言，高精度；无时间戳）</div>
    <div class="row">
      <button id="asr-rec-btn" class="secondary">🎤 录音</button>
      <input type="file" id="asr-file" accept="audio/*" style="flex:1;color:var(--sub);font-size:13px">
    </div>
    <div style="margin-top:10px"><button id="asr-btn">🗣️ 开始识别</button></div>
    <label>识别结果</label>
    <textarea id="asr-text" rows="3" readonly></textarea>
    <div class="msg" id="asr-msg"></div>
  </div>

  <!-- ===== 音色库管理 ===== -->
  <div class="card">
    <h2>💾 音色库（克隆音色）</h2>
    <div class="hint">克隆保存的音色持久存储，出现在上方音色下拉中可直接使用</div>
    <div id="custom-voices"></div>
    <div class="msg" id="voices-msg"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const token = () => localStorage.getItem("speech_token") || "";

async function api(path, opts = {}) {
  opts.headers = Object.assign({}, opts.headers);
  if (token()) opts.headers["X-Speech-Token"] = token();
  const resp = await fetch(path, opts);
  if (resp.status === 401) {
    const t = prompt("服务已开启鉴权，请输入 SPEECH_TOKEN：");
    if (t) { localStorage.setItem("speech_token", t); return api(path, opts); }
    throw new Error("未提供鉴权 token");
  }
  if (!resp.ok) {
    let detail = "HTTP " + resp.status;
    try { detail = (await resp.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return resp;
}

function setMsg(id, text, cls) {
  const el = $(id); el.textContent = text; el.className = "msg " + (cls || "");
}

// ---- 状态栏 ----
async function loadHealth() {
  try {
    const h = await (await api("/health")).json();
    const fmt = (ready, dl) => ready ? "✅就绪" : (dl ? "⬇️自动下载中" : "⏳未就绪");
    $("status").innerHTML =
      `设备 <b>${h.device}</b> ｜ 合成(CustomVoice) <b>${fmt(h.tts, h.tts_downloading)}</b> ｜ ` +
      `克隆(Base) <b>${fmt(h.tts_base, h.tts_base_downloading)}</b> ｜ ` +
      `识别(ASR) <b>${fmt(h.asr, h.asr_downloading)}</b>` +
      (h.tts_downloading || h.tts_base_downloading || h.asr_downloading
        ? '<br>⬇️ 模型首次自动下载/转换中（约 10-20 分钟），期间直接发起合成/识别会自动等待' : "");
  } catch (e) { $("status").textContent = "❌ 服务不可达: " + e.message; }
}

// ---- 音色列表 ----
let voices = [];
async function loadVoices() {
  try {
    const data = await (await api("/voices")).json();
    voices = data.voices || [];
    const sel = $("voice"); sel.innerHTML = "";
    const g1 = document.createElement("optgroup"); g1.label = "内置音色";
    const g2 = document.createElement("optgroup"); g2.label = "克隆音色";
    for (const v of voices) {
      const o = document.createElement("option");
      o.value = v.id; o.textContent = `${v.name || v.id} · ${v.desc || ""}`;
      (v.custom ? g2 : g1).appendChild(o);
    }
    if (g1.children.length) sel.appendChild(g1);
    if (g2.children.length) sel.appendChild(g2);
    if (data.default && voices.some(v => v.id === data.default)) sel.value = data.default;
    renderCustomList();
  } catch (e) { setMsg("voices-msg", "音色列表加载失败: " + e.message, "err"); }
}

function renderCustomList() {
  const box = $("custom-voices"); box.innerHTML = "";
  const customs = voices.filter(v => v.custom);
  if (!customs.length) { box.innerHTML = '<div class="hint">暂无克隆音色，用上方「音色克隆」保存一个吧</div>'; return; }
  for (const v of customs) {
    const row = document.createElement("div"); row.className = "voice-item";
    row.innerHTML = `<span class="name">${v.name} <span class="tag">${v.has_ref_text ? "ICL" : "声纹"}</span></span>`;
    const play = document.createElement("button"); play.className = "secondary"; play.textContent = "▶ 试听";
    play.onclick = () => { new Audio("/voices/custom/" + v.id + "/ref.wav").play().catch(() => {}); };
    const del = document.createElement("button"); del.className = "danger"; del.textContent = "删除";
    del.onclick = async () => {
      if (!confirm(`删除克隆音色「${v.name}」？`)) return;
      try { await api("/voices/custom/" + v.id, { method: "DELETE" }); await loadVoices(); }
      catch (e) { setMsg("voices-msg", "删除失败: " + e.message, "err"); }
    };
    row.appendChild(play); row.appendChild(del); box.appendChild(row);
  }
}

// ---- 麦克风录音（通用：点一次开始，再点一次停止） ----
let activeRec = null; // { mr, btn, msgId, target, timer, t0 }
async function toggleRec(btnId, msgId, target) {
  if (activeRec) { activeRec.mr.stop(); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { setMsg(msgId, "无法访问麦克风: " + e.message, "err"); return; }
  const mr = new MediaRecorder(stream);
  const chunks = [];
  mr.ondataavailable = ev => { if (ev.data.size) chunks.push(ev.data); };
  mr.onstop = () => {
    const blob = new Blob(chunks, { type: chunks[0]?.type || "audio/webm" });
    stream.getTracks().forEach(t => t.stop());
    clearInterval(activeRec.timer);
    const btn = activeRec.btn;
    btn.textContent = btn.dataset.idle; btn.classList.remove("rec");
    activeRec = null;
    target(blob);
  };
  const btn = $(btnId);
  btn.dataset.idle = btn.textContent;
  btn.textContent = "⏹ 停止 (0s)"; btn.classList.add("rec");
  mr.start();
  const t0 = Date.now();
  const timer = setInterval(() => { btn.textContent = `⏹ 停止 (${Math.floor((Date.now() - t0) / 1000)}s)`; }, 500);
  activeRec = { mr, btn, msgId, timer };
}

// ---- 合成 ----
$("synth-btn").onclick = async () => {
  const text = $("synth-text").value.trim();
  if (!text) { setMsg("synth-msg", "请输入合成文本", "warn"); return; }
  const btn = $("synth-btn"); btn.disabled = true;
  setMsg("synth-msg", "⏳ 合成中（克隆音色首次使用需加载模型，请耐心等待）...");
  try {
    const resp = await api("/tts/synthesize", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        text, speaker: $("voice").value, language: $("synth-lang").value,
        instruct: $("synth-instruct").value.trim() || null,
      }),
    });
    $("synth-audio").src = URL.createObjectURL(await resp.blob());
    setMsg("synth-msg", `✅ 合成完成（${resp.headers.get("X-Elapsed-Ms")}ms）`, "ok");
  } catch (e) { setMsg("synth-msg", "❌ " + e.message, "err"); }
  btn.disabled = false;
};

// ---- 克隆 ----
let cloneBlob = null;
$("rec-btn").onclick = () => toggleRec("rec-btn", "rec-msg", b => {
  cloneBlob = b; $("clone-file").value = "";
  setMsg("rec-msg", "✅ 录音完成 " + (b.size / 1024).toFixed(0) + "KB，建议 ≥5 秒", "ok");
});
$("clone-file").onchange = function () {
  if (this.files[0]) { cloneBlob = this.files[0]; setMsg("rec-msg", "已选择文件: " + this.files[0].name, "ok"); }
};

function cloneFormData() {
  const fd = new FormData();
  const f = cloneBlob || ($("clone-file").files[0] || null);
  if (!f) { setMsg("clone-msg", "请先录音或选择参考音频文件", "warn"); return null; }
  fd.append("file", f, f.name || "ref.webm");
  const text = $("clone-text").value.trim();
  if (!text) { setMsg("clone-msg", "请输入克隆文本", "warn"); return null; }
  fd.append("text", text);
  fd.append("ref_text", $("clone-ref-text").value.trim());
  fd.append("language", $("clone-lang").value);
  fd.append("x_vector_only", $("clone-xvec").checked);
  return fd;
}

$("clone-btn").onclick = async () => {
  const fd = cloneFormData(); if (!fd) return;
  const name = $("clone-name").value.trim();
  if (name) fd.append("save_as", name);   // 填了名称 = 同时保存为音色
  const btn = $("clone-btn"); btn.disabled = true;
  setMsg("clone-msg", "⏳ 克隆合成中（首次需下载/加载 Base 模型，可能数分钟）...");
  try {
    const resp = await api("/tts/clone", { method: "POST", body: fd });
    $("clone-audio").src = URL.createObjectURL(await resp.blob());
    let msg = `✅ 克隆完成（${resp.headers.get("X-Elapsed-Ms")}ms，${resp.headers.get("X-Segments")} 段）`;
    if (resp.headers.get("X-Xvector-Only") === "true") msg += " · 本次用声纹模式（建议补参考原文提升效果）";
    const saved = resp.headers.get("X-Saved-Voice");
    if (saved) msg += ` · 已保存音色「${saved}」`;
    setMsg("clone-msg", msg, "ok");
    await loadVoices();
  } catch (e) { setMsg("clone-msg", "❌ " + e.message, "err"); }
  btn.disabled = false;
};

$("save-voice-btn").onclick = async () => {
  const fd = cloneFormData(); if (!fd) return;
  const name = $("clone-name").value.trim();
  if (!name) { setMsg("clone-msg", "请填写音色名称", "warn"); return; }
  const btn = $("save-voice-btn"); btn.disabled = true;
  setMsg("clone-msg", "⏳ 保存音色中...");
  try {
    const resp = await (await api("/voices/custom", { method: "POST", body: fd })).json();
    setMsg("clone-msg", `✅ 音色已保存「${resp.name}」${resp.note ? "（" + resp.note + "）" : ""}`, "ok");
    await loadVoices();
  } catch (e) { setMsg("clone-msg", "❌ " + e.message, "err"); }
  btn.disabled = false;
};

// ---- ASR ----
let asrBlob = null;
$("asr-rec-btn").onclick = () => toggleRec("asr-rec-btn", "asr-msg", b => {
  asrBlob = b; $("asr-file").value = "";
  setMsg("asr-msg", "✅ 录音完成 " + (b.size / 1024).toFixed(0) + "KB", "ok");
});
$("asr-file").onchange = function () {
  if (this.files[0]) { asrBlob = this.files[0]; setMsg("asr-msg", "已选择文件: " + this.files[0].name, "ok"); }
};
$("asr-btn").onclick = async () => {
  const f = asrBlob || ($("asr-file").files[0] || null);
  if (!f) { setMsg("asr-msg", "请先录音或选择音频文件", "warn"); return; }
  const btn = $("asr-btn"); btn.disabled = true;
  setMsg("asr-msg", "⏳ 识别中...");
  try {
    const fd = new FormData(); fd.append("file", f, f.name || "audio.webm");
    const data = await (await api("/asr/transcribe", { method: "POST", body: fd })).json();
    $("asr-text").value = data.text;
    setMsg("asr-msg", `✅ 识别完成（${data.language}，${data.elapsed_ms}ms）`, "ok");
  } catch (e) { setMsg("asr-msg", "❌ " + e.message, "err"); }
  btn.disabled = false;
};

loadHealth(); loadVoices();
setInterval(loadHealth, 15000);
</script>
</body>
</html>
