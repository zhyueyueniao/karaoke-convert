services:
  ktv-convert:
    image: karaoke-tool-ultra255:latest
    container_name: karaoke-tool-ultra255
    # venv 在镜像内 /opt/venv（挂载点 /app 之外，不受 ./app 热更新挂载影响）
    command: /opt/venv/bin/python3 /app/app.py
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "7860:7860"
      - "7861:7861"
    volumes:
      # 热更新：宿主机修改代码 后 docker compose restart 即可生效，无需重建镜像
      - ./app:/app
      # HuggingFace 模型缓存（stable-ts / faster-whisper / demucs 部分模型）
      - ./model_cache/huggingface:/root/.cache/huggingface
      # Torch Hub 模型缓存（Demucs 模型文件）
      - ./model_cache/torch:/root/.cache/torch
      # 处理输出持久化（重启不丢结果）
      #- ./output:/app/output
      # 宿主机与容器交换文件的共享目录
      #- ./workspace:/app/workspace
    environment:
      # 帮助 Level Zero 识别 Intel GPU（Z425/Core Ultra 需要）
      - ZES_ENABLE_SYSMAN=1

      # ---- HuggingFace 国内镜像 ----
      - HF_ENDPOINT=https://hf-mirror.com
      # 禁用 Xet/CAS 传输，镜像站不支持
      - HF_HUB_ENABLE_HF_TRANSFER=0
      - HF_HUB_DISABLE_XET=1
      # ---- 歌词对齐后端（Pilot）----
      # qwen3: Qwen3-ForcedAligner-0.6B（文本↔音频直接对齐，中文/粤语原生），
      #        首次对齐时自动下载 ~1.2GB 到 model_cache/huggingface
      # stable-ts: 原 whisper DTW 对齐（切回默认改回此值）
      - ALIGN_BACKEND=qwen3
      #- ALIGNER_MODEL=Qwen/Qwen3-ForcedAligner-0.6B
      #- KARAOKE_API=1 # 启用 karaoke api
    deploy:
      resources:
        limits:
          memory: 24G
        reservations:
          memory: 8G
    security_opt:
      - no-new-privileges:true

    # ---- Intel iGPU 加速 ----
    # 大部分 NAS（极空间/群晖等）的 render 组名或 GID 与标准发行版不同，
    # 如果容器无法识别 render 组，在宿主机上执行：
    #   ls -la /dev/dri/renderD128
    #   stat -c '%g' /dev/dri/renderD128
    # 看输出中的组名和 GID，按实际情况填。常见：video(44) / render(109) / render(104)
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
      # - render          # Z425 若报错 render 组不存在，注释这一行换成下一行
      - "992"

  # ---- 语音 sidecar：Qwen3-ASR（高精度识别）+ Qwen3-TTS（语音合成/音色克隆）独立容器 ----
  # 独立项目（speech_service/），与主容器完全解耦；自带网页 http://<NAS-IP>:7862/
  # （合成/克隆/识别，支持麦克风录音）。首次启动访问 :7862/docs，
  # 通过 POST /models/download?kind=tts|tts-base|asr 下载模型（tts+asr 共约 8GB，克隆用 tts-base 再 +3.8GB）。
  ktv-speech:
    build: ./speech_service
    image: ktv-speech:latest
    container_name: ktv-speech
    command: /opt/speech-venv/bin/python -u /app/speech/server.py
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "7862:7862"
    volumes:
      # 代码热挂载：修改 speech_service/ 后 docker compose restart ktv-speech 即生效
      - ./speech_service:/app/speech
      # 模型持久化（modelscope 权重 ckpt + OpenVINO IR ov）
      - ./model_cache/speech:/models
    environment:
      - ZES_ENABLE_SYSMAN=1
      - HF_ENDPOINT=https://hf-mirror.com
      - HF_HUB_ENABLE_HF_TRANSFER=0
      - HF_HUB_DISABLE_XET=1
      #- SPEECH_DEVICE=GPU          # 留空自动探测（GPU 优先）
      #- SPEECH_TOKEN=              # 可选鉴权，主服务侧需同步设置 SPEECH_SYNC_TOKEN
      #- TTS_DEFAULT_SPEAKER=Serena
      #- TTS_BASE_IDLE_UNLOAD=30    # 克隆用 Base 模型空闲卸载阈值（分钟），0=常驻不卸载
    deploy:
      resources:
        limits:
          # 16G：CustomVoice+ASR 常驻约 8-9GB，克隆用 Base 模型惰性加载再加约 4GB
          memory: 16G
        reservations:
          memory: 4G
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
      - "992"

